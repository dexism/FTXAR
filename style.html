<style>
/* FTXAR - Tactical HUD & WebAR Styles (style.html) */
/* Version: 2610082015 */

:root {
    --ftx-green: #00ff88;
    --ftx-green-dim: rgba(0, 255, 136, 0.25);
    --ftx-red: #ff3b30;
    --ftx-orange: #ff9500;
    --ftx-bg-panel: rgba(16, 22, 18, 0.88);
    --ftx-border: rgba(0, 255, 136, 0.4);
    --ftx-font-mono: 'Roboto Mono', 'SF Pro Display', Consolas, Menlo, monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-user-select: none;
    user-select: none;
}

html, body {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background-color: #06110a;
    background: radial-gradient(ellipse at center, #11221a 0%, #06110a 70%, #020503 100%);
    font-family: var(--ftx-font-mono);
    color: #e0e0e0;
}

/* 1. 全画面カメラ映像 & WebGL レイヤー */
#camera-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    object-fit: cover;
    z-index: 1;
    background-color: #06110a;
}

#ar-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    z-index: 2;
    pointer-events: none;
}

#reticle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    z-index: 3;
    pointer-events: none;
}

/* 2. HUD コンテナ */
#hud-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* 上部コントロールバー */
.hud-top-bar {
    pointer-events: auto;
    width: 100%;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
    gap: 8px;
    flex-wrap: wrap;
}

.hud-brand {
    font-size: 0.9em;
    font-weight: bold;
    color: var(--ftx-green);
    text-shadow: 0 0 6px rgba(0, 255, 136, 0.6);
    display: flex;
    align-items: center;
    gap: 6px;
}

.hud-btn-group {
    display: flex;
    gap: 6px;
    align-items: center;
}

.hud-btn {
    background: rgba(16, 24, 20, 0.75);
    color: #fff;
    border: 1px solid var(--ftx-border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 0.75em;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: all 0.15s ease;
}

.hud-btn:active {
    background: var(--ftx-green);
    color: #000;
}

.hud-btn.active {
    background: var(--ftx-green);
    color: #000;
    border-color: var(--ftx-green);
}

.hud-btn-primary {
    background: rgba(0, 255, 136, 0.2);
    color: var(--ftx-green);
    border: 1px solid var(--ftx-green);
}

/* 右側ズームコントロール */
.hud-right-zoom {
    pointer-events: auto;
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.zoom-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(16, 24, 20, 0.8);
    border: 1px solid var(--ftx-border);
    color: var(--ftx-green);
    font-size: 0.75em;
    font-weight: bold;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(4px);
}

.zoom-btn.active {
    background: var(--ftx-green);
    color: #000;
}

/* 下部ステータスバー (MGRS座標) */
.hud-bottom-bar {
    pointer-events: auto;
    width: 100%;
    padding: 12px 14px;
    background: linear-gradient(0deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.mgrs-display {
    font-size: 1.05em;
    font-weight: bold;
    color: var(--ftx-green);
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.7);
    background: rgba(0, 20, 10, 0.6);
    border: 1px solid var(--ftx-border);
    border-radius: 4px;
    padding: 5px 14px;
}

.hud-sub-info {
    font-size: 0.7em;
    color: #aaa;
    display: flex;
    gap: 16px;
}

/* 3. モーダルダイアログ */
.ftx-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.ftx-modal-content {
    width: 100%;
    max-width: 440px;
    max-height: 90dvh;
    background: var(--ftx-bg-panel);
    border: 2px solid var(--ftx-border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 16px rgba(0, 255, 136, 0.2);
    overflow: hidden;
}

.ftx-modal-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--ftx-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0, 20, 10, 0.4);
}

.ftx-modal-title {
    font-size: 0.95em;
    font-weight: bold;
    color: var(--ftx-green);
}

.ftx-modal-close {
    background: transparent;
    border: none;
    color: #aaa;
    font-size: 1.2em;
    cursor: pointer;
    padding: 4px;
}

.ftx-modal-body {
    padding: 14px 16px;
    overflow-y: auto;
    font-size: 0.85em;
}

.ftx-form-group {
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.ftx-form-group label {
    font-size: 0.75em;
    color: #9ab;
}

.ftx-form-group input,
.ftx-form-group select {
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid #445;
    border-radius: 4px;
    color: #fff;
    padding: 7px 10px;
    font-family: inherit;
    font-size: 0.9em;
}

.ftx-form-group input:focus,
.ftx-form-group select:focus {
    outline: none;
    border-color: var(--ftx-green);
    box-shadow: 0 0 6px var(--ftx-green-dim);
}

.ftx-form-row {
    display: flex;
    gap: 10px;
}

.ftx-form-row .ftx-form-group.half {
    flex: 1;
}

.ftx-modal-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--ftx-border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    background: rgba(0, 20, 10, 0.4);
}

.ftx-btn-primary {
    background: var(--ftx-green);
    color: #000;
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
}

.ftx-btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 8px 14px;
    font-family: inherit;
    cursor: pointer;
}

/* キャリブレーション情報ボックス */
.ftx-cal-info-box {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--ftx-border);
    border-radius: 6px;
    padding: 10px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.85em;
}

.cal-row {
    display: flex;
    justify-content: space-between;
}

.cal-row strong {
    color: var(--ftx-green);
}

/* 任務リストカード */
.mission-card {
    background: rgba(0, 20, 10, 0.4);
    border: 1px solid var(--ftx-border);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.mission-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(0, 255, 136, 0.2);
    padding-bottom: 4px;
}

.mission-card-title {
    font-weight: bold;
    color: var(--ftx-green);
}

.mission-status-badge {
    font-size: 0.7em;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: bold;
}

.mission-status-badge.active {
    background: var(--ftx-green);
    color: #000;
}

.mission-status-badge.cease_fire {
    background: var(--ftx-red);
    color: #fff;
}

.mission-card-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 6px;
}

.btn-cease-fire {
    background: rgba(255, 59, 48, 0.2);
    border: 1px solid var(--ftx-red);
    color: var(--ftx-red);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 0.8em;
    cursor: pointer;
}

.btn-resume-fire {
    background: rgba(0, 255, 136, 0.2);
    border: 1px solid var(--ftx-green);
    color: var(--ftx-green);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 0.8em;
    cursor: pointer;
}

/* カメラ状態・制限警告バナー */
#camera-status-banner {
    pointer-events: auto;
    width: 95%;
    max-width: 600px;
    margin: 8px auto 0 auto;
    padding: 8px 12px;
    background: rgba(20, 10, 10, 0.92);
    border: 1px solid var(--ftx-orange);
    border-radius: 6px;
    color: #ffcc00;
    font-size: 0.75em;
    line-height: 1.4;
    text-align: center;
    box-shadow: 0 0 10px rgba(255, 149, 0, 0.4);
    display: none;
}

#camera-status-banner .banner-actions {
    margin-top: 6px;
    display: flex;
    justify-content: center;
    gap: 8px;
}

.banner-btn {
    background: var(--ftx-orange);
    color: #000;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 0.85em;
    cursor: pointer;
}

/* カメラ起動ボタンの強調 */
#btn-start-camera.active-stream {
    border-color: var(--ftx-green);
    color: var(--ftx-green);
}
#btn-start-camera.stream-error {
    border-color: var(--ftx-orange);
    color: var(--ftx-orange);
    animation: ftxPulse 1.5s infinite;
}

@keyframes ftxPulse {
    0% { opacity: 1.0; }
    50% { opacity: 0.5; }
    100% { opacity: 1.0; }
}

/* 初回起動タップ誘導オーバーレイ */
#start-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    background: rgba(0, 0, 0, 0.75);
    z-index: 50;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    backdrop-filter: blur(3px);
}

.start-box {
    text-align: center;
    padding: 24px;
    border: 2px solid var(--ftx-green);
    background: rgba(10, 20, 15, 0.9);
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
    max-width: 85%;
}

.start-box h2 {
    color: var(--ftx-green);
    font-size: 1.3em;
    margin-bottom: 12px;
}

.start-box p {
    font-size: 0.85em;
    color: #ccc;
    margin-bottom: 16px;
    line-height: 1.5;
}

.start-box .tap-btn {
    display: inline-block;
    background: var(--ftx-green);
    color: #000;
    font-weight: bold;
    padding: 10px 24px;
    border-radius: 6px;
    font-size: 1em;
}
</style>
