<script>
/**
 * FTXAR - 10-Mil Tactical Reticle & Zoom Engine (reticle.html)
 * Version: 2610082045
 * 
 * 10ミル単位のレティクル重畳描画 (ON/OFF切替可能)
 * カメラ画角(FOV)およびズーム倍率に完全連動する光学測角グリッド
 */

(function(window) {
    'use strict';

    var reticleState = {
        isVisible: true,
        currentZoom: 1.0,     // 1.0x, 2.0x, 5.0x, 10.0x
        baseFovDeg: 60.0,     // 標準カメラ垂直画角 (度)
        canvas: null,
        ctx: null
    };

    /**
     * レティクル描画キャンバスの初期化
     */
    function initReticle(canvasElement) {
        reticleState.canvas = canvasElement;
        reticleState.ctx = canvasElement.getContext('2d');
        resizeReticle();
        window.addEventListener('resize', resizeReticle);
        // 初期描画
        drawReticle(reticleState.baseFovDeg);
    }

    function resizeReticle() {
        if (!reticleState.canvas) return;
        var w = window.innerWidth;
        var h = window.innerHeight;
        var dpr = window.devicePixelRatio || 1;
        reticleState.canvas.width = w * dpr;
        reticleState.canvas.height = h * dpr;
        reticleState.canvas.style.width = w + 'px';
        reticleState.canvas.style.height = h + 'px';
        drawReticle(reticleState.baseFovDeg);
    }

    /**
     * レティクルの描画 (毎フレーム呼出)
     * @param {number} cameraFovDeg カメラ垂直画角 (度)
     * @param {number} pitchRad 仰角ピッチ (ラジアン, 上向き正)
     * @param {number} rollRad 画面の傾きロール (ラジアン, 時計回り正)
     */
    function drawReticle(cameraFovDeg, pitchRad, rollRad) {
        if (!reticleState.isVisible || !reticleState.ctx || !reticleState.canvas) return;

        var ctx = reticleState.ctx;
        var canvas = reticleState.canvas;
        var dpr = window.devicePixelRatio || 1;
        var w = canvas.width;
        var h = canvas.height;
        var cx = w / 2.0;
        var cy = h / 2.0;

        ctx.clearRect(0, 0, w, h);

        var pRad = (typeof pitchRad === 'number') ? pitchRad : 0;
        var rRad = (typeof rollRad === 'number') ? rollRad : 0;

        // 垂直視野角 (FOV)
        var fovDeg = (cameraFovDeg || (reticleState.baseFovDeg / reticleState.currentZoom));
        var fovRad = (fovDeg * Math.PI) / 180.0;

        // 1ミルあたりのピクセル幅 (Angular True-Scale)
        // Three.js カメラ PerspectiveCamera と 1:1 に完全一致
        var milRad = (2.0 * Math.PI) / 6400.0;
        var pxPerMil = ((h / 2.0) / Math.tan(fovRad / 2.0)) * Math.tan(milRad);

        // 仰角ミル値
        var pitchMil = Math.round(pRad * (6400.0 / (2.0 * Math.PI)));

        ctx.save();

        // ----------------------------------------------------
        // ★ 画面中央を原点とし、実世界の水平線に合わせて傾ける (+rollRad 回転)
        // ----------------------------------------------------
        ctx.translate(cx, cy);
        ctx.rotate(rRad);

        ctx.strokeStyle = '#00ff88'; // 軍用蛍光グリーン
        ctx.fillStyle = '#00ff88';
        ctx.font = Math.round(11 * dpr) + "px 'Roboto Mono', monospace, sans-serif";
        ctx.lineWidth = 1.5 * dpr;

        // ====================================================
        // 1. 水平線 (Artificial Horizon: 仰角 0 ミル基準線)
        // ====================================================
        // カメラが上を向く (pitchMil > 0) と水平線は画面中心より下に現れる (+y 方向)
        var yHorizon = pitchMil * pxPerMil;
        var maxVisibleY = Math.sqrt(cx * cx + cy * cy); // 回転時にも切れない最大対角線半径

        if (Math.abs(yHorizon) < maxVisibleY) {
            ctx.save();
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2.2 * dpr;

            var horizonHalfWidth = Math.min(w * 0.45, 320 * dpr);
            var centerGap = 35 * dpr; // 照準中央を邪魔しないギャップ
            var tickDown = 9 * dpr;   // 地面側(下側)を示すインジケーター爪

            // 左側水平線
            ctx.beginPath();
            ctx.moveTo(-horizonHalfWidth, yHorizon);
            ctx.lineTo(-centerGap, yHorizon);
            // 左側下向き爪
            ctx.moveTo(-horizonHalfWidth, yHorizon);
            ctx.lineTo(-horizonHalfWidth, yHorizon + tickDown);
            ctx.stroke();

            // 右側水平線
            ctx.beginPath();
            ctx.moveTo(centerGap, yHorizon);
            ctx.lineTo(horizonHalfWidth, yHorizon);
            // 右側下向き爪
            ctx.moveTo(horizonHalfWidth, yHorizon);
            ctx.lineTo(horizonHalfWidth, yHorizon + tickDown);
            ctx.stroke();

            // 水平線端の「0」ラベル (水平基準 0 mil)
            ctx.font = "bold " + Math.round(11 * dpr) + "px 'Roboto Mono', monospace, sans-serif";
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillText("0", -horizonHalfWidth - 6 * dpr, yHorizon);
            ctx.textAlign = 'left';
            ctx.fillText("0", horizonHalfWidth + 6 * dpr, yHorizon);

            ctx.restore();
        }

        // ====================================================
        // 2. ピッチラダー (仰角補助目盛線: ±50, ±100, ±200 mil)
        // ====================================================
        var ladderMils = [-200, -100, -50, 50, 100, 200];
        ctx.save();
        ctx.lineWidth = 1.2 * dpr;
        ctx.strokeStyle = 'rgba(0, 255, 136, 0.7)';
        ctx.fillStyle = 'rgba(0, 255, 136, 0.85)';
        ctx.font = Math.round(9 * dpr) + "px 'Roboto Mono', monospace, sans-serif";

        for (var li = 0; li < ladderMils.length; li++) {
            var lMil = ladderMils[li];
            var ly = yHorizon - (lMil * pxPerMil);
            if (Math.abs(ly) > maxVisibleY) continue;

            var barW = (Math.abs(lMil) >= 100) ? 50 * dpr : 30 * dpr;
            var gapW = 30 * dpr;

            // 負の仰角(地下側)は破線、正の仰角(空側)は実線
            if (lMil < 0) {
                ctx.setLineDash([4 * dpr, 3 * dpr]);
            } else {
                ctx.setLineDash([]);
            }

            // 左バー
            ctx.beginPath();
            ctx.moveTo(-barW - gapW, ly);
            ctx.lineTo(-gapW, ly);
            ctx.stroke();

            // 右バー
            ctx.beginPath();
            ctx.moveTo(gapW, ly);
            ctx.lineTo(barW + gapW, ly);
            ctx.stroke();

            ctx.setLineDash([]);
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            var signStr = (lMil > 0) ? "+" : "";
            ctx.fillText(signStr + lMil, -barW - gapW - 4 * dpr, ly);
            ctx.textAlign = 'left';
            ctx.fillText(signStr + lMil, barW + gapW + 4 * dpr, ly);
        }
        ctx.restore();

        // ====================================================
        // 3. 中央視準レティクル (光軸中心 x=0, y=0 基準)
        // ====================================================
        // A. 中央照準点 (外径5pxの微小サークル + 中心微小ドット)
        ctx.beginPath();
        ctx.arc(0, 0, 4.5 * dpr, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 1.2 * dpr, 0, Math.PI * 2);
        ctx.fill();

        // B. 水平軸の 10 ミル目盛線 (±250ミルまで, 水平線と完全平行)
        var maxMil = 250;
        for (var m = -maxMil; m <= maxMil; m += 10) {
            if (m === 0) continue;
            var x = m * pxPerMil;
            if (Math.abs(x) > maxVisibleY) continue;

            var tickLen = 5 * dpr;   // 10ミル小目盛
            var is50 = (m % 50 === 0);
            var is100 = (m % 100 === 0);

            if (is100) {
                tickLen = 14 * dpr;  // 100ミル大目盛
            } else if (is50) {
                tickLen = 9 * dpr;   // 50ミル中目盛
            }

            ctx.beginPath();
            ctx.moveTo(x, -tickLen);
            ctx.lineTo(x, tickLen);
            ctx.stroke();

            // 100ミルごとの数値ラベル
            if (is100) {
                var label = Math.abs(m).toString();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(label, x, tickLen + 4 * dpr);
            }
        }

        // C. 垂直軸の 10 ミル目盛線 (±250ミルまで, 重力鉛直方向と完全平行)
        for (var m2 = -maxMil; m2 <= maxMil; m2 += 10) {
            if (m2 === 0) continue;
            var y = -m2 * pxPerMil; // 上が正の仰角
            if (Math.abs(y) > maxVisibleY) continue;

            var tickLen2 = 5 * dpr;
            var is50_2 = (m2 % 50 === 0);
            var is100_2 = (m2 % 100 === 0);

            if (is100_2) {
                tickLen2 = 14 * dpr;
            } else if (is50_2) {
                tickLen2 = 9 * dpr;
            }

            ctx.beginPath();
            ctx.moveTo(-tickLen2, y);
            ctx.lineTo(tickLen2, y);
            ctx.stroke();

            // 100ミルごとの数値ラベル
            if (is100_2) {
                var label2 = Math.abs(m2).toString();
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(label2, tickLen2 + 5 * dpr, y);
            }
        }

        ctx.restore(); // -rollRad 回転の解除

        // ====================================================
        // 4. 画面固定情報 (右上ステータス)
        // ====================================================
        ctx.save();
        ctx.fillStyle = '#00ff88';
        ctx.font = Math.round(11 * dpr) + "px 'Roboto Mono', monospace, sans-serif";
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.fillText("RETICLE: 10 MIL / TICK  [" + reticleState.currentZoom.toFixed(1) + "x]", w - 20 * dpr, 48 * dpr);
        ctx.restore();
    }

    /**
     * レティクル表示トグル
     */
    function toggleReticle() {
        reticleState.isVisible = !reticleState.isVisible;
        if (!reticleState.isVisible && reticleState.ctx && reticleState.canvas) {
            reticleState.ctx.clearRect(0, 0, reticleState.canvas.width, reticleState.canvas.height);
        } else {
            drawReticle(reticleState.baseFovDeg, 0, 0);
        }
        return reticleState.isVisible;
    }

    /**
     * ズーム倍率の変更 (1x, 2x, 5x, 10x等)
     */
    function setZoom(zoomLevel) {
        reticleState.currentZoom = Math.max(1.0, Math.min(10.0, zoomLevel));
        drawReticle(reticleState.baseFovDeg / reticleState.currentZoom, 0, 0);
        return reticleState.currentZoom;
    }

    // グローバル公開
    window.FTXAR_RETICLE = {
        initReticle: initReticle,
        drawReticle: drawReticle,
        toggleReticle: toggleReticle,
        setZoom: setZoom,
        getState: function() { return reticleState; }
    };

})(window);
</script>
